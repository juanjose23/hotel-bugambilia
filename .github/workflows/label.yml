name: Labeler
on: [pull_request_target]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/labeler@v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
