name: Laravel Dusk portable
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dusk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Construir herramientas de navegador
        run: docker compose --profile dusk build dusk
      - name: Probar la aplicación con Selenium y PostgreSQL aislados
        run: docker compose --profile dusk run --rm dusk
      - name: Conservar evidencias
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-failure-evidence
          path: |
            tests/Browser/screenshots/
            tests/Browser/console/
      - name: Detener servicios
        if: always()
        run: docker compose --profile dusk down --remove-orphans
