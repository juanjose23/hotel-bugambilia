name: CI Laravel & Filament

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: |
            mbstring
            xml
            ctype
            iconv
            pdo
            pdo_sqlite
            sqlite3
            bcmath
            intl
            zip
          coverage: none

      - name: Preparar Entorno y SQLite (.env)
        run: |
          cp .env.example .env.testing
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env.testing
          # Limpiar variables innecesarias de otras BDs
          sed -i 's/DB_HOST=.*/# DB_HOST=/' .env.testing
          sed -i 's/DB_PORT=.*/# DB_PORT=/' .env.testing
          sed -i 's/DB_USERNAME=.*/# DB_USERNAME=/' .env.testing
          sed -i 's/DB_PASSWORD=.*/# DB_PASSWORD=/' .env.testing

      - name: Cachear Dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-php-${{ hashFiles('**/composer.lock') }}

      - name: Instalar Dependencias de Composer
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Inicializar Aplicación Laravel
        run: |
          php artisan key:generate --env=testing
          php artisan filament:upgrade || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Instalar y Compilar Assets (Vite)
        run: |
          # Usar el método óptimo según exista lockfile
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --silent
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --silent
          else
            echo "No se encontró lockfile; instalando con npm install..."
            npm install --silent
          fi

          npm run build --silent

      - name: Ejecutar Migraciones
        run: php artisan migrate --env=testing --force

      - name: Ejecutar Pruebas Automatizadas
        run: php artisan test --env=testing