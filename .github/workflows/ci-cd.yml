name: CI y producción
on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/tests.yml
  browser:
    uses: ./.github/workflows/dusk-tests.yml
  production-image:
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar el control de despliegue
        run: node --test scripts/deploy-production.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Identificar imagen
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Construir imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=hotel-production
          cache-to: type=gha,mode=max,scope=hotel-production
      - name: Probar imagen de producción en entorno sintético
        env:
          PRODUCTION_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          EXPECTED_REVISION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/production-smoke.mjs
      - name: Autenticar publicación
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar versión por commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "digest=${reference#*@}" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: production-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: hotel-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      EXPECTED_REVISION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar configuración del servidor
        run: node scripts/deploy-production.mjs --validate
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promover la imagen verificada
        env:
          IMAGE: ${{ needs.production-image.outputs.image }}
          DIGEST: ${{ needs.production-image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:production" "$IMAGE@$DIGEST"
      - name: Desplegar y verificar en Coolify o Dokploy
        run: node scripts/deploy-production.mjs
