name: Calidad y pruebas portables
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Construir imagen de herramientas con caché
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tooling
          load: true
          tags: hotel-bugambilia:tools
          cache-from: type=gha,scope=hotel-tools
          cache-to: type=gha,mode=max,scope=hotel-tools
      - name: Formato, análisis, pruebas y compilación
        run: docker compose -f compose.ci.yaml --profile quality run --rm tools node scripts/project.mjs check
      - name: Detener los servicios de pruebas
        if: always()
        run: docker compose -f compose.ci.yaml --profile quality down --remove-orphans
