name: Calidad y pruebas portables
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Construir aplicación y herramientas
        run: docker compose --profile quality build app tools
      - name: Formato, análisis, pruebas y compilación
        run: docker compose --profile quality run --rm tools node scripts/project.mjs check
      - name: Detener los servicios de pruebas
        if: always()
        run: docker compose --profile quality down --remove-orphans
