# Auto-label PRs based on changed paths

# Modules
"module: compras":
  - changed-files:
    - any-glob-to-any-file: "app/UseCases/Compras/**"
    - any-glob-to-any-file: "app/Models/Compras/**"
    - any-glob-to-any-file: "app/Filament/Resources/Compras/**"
    - any-glob-to-any-file: "database/migrations/*compras*"

"module: inventarios":
  - changed-files:
    - any-glob-to-any-file: "app/UseCases/Inventarios/**"
    - any-glob-to-any-file: "app/Models/Inventario/**"
    - any-glob-to-any-file: "database/migrations/*inventario*"

