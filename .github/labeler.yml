# Types
"type: filament":
  - changed-files:
    - any-glob-to-any-file: "app/Filament/**"

"type: migration":
  - changed-files:
    - any-glob-to-any-file: "database/migrations/**"

"type: test":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

"type: config":
  - changed-files:
    - any-glob-to-any-file: "config/**"

"type: seeders":
  - changed-files:
    - any-glob-to-any-file: "database/seeders/**"

"type: workflow":
  - changed-files:
    - any-glob-to-any-file: ".github/workflows/**"
