name: hotel-bugambilia

services:
  app:
    image: hotel-bugambilia:local
    build:
      context: .
      target: runtime
    ports:
      - "${HOTEL_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - hotel-storage:/var/www/html/storage

volumes:
  hotel-storage:

networks:
  default:
    name: ${DOCKER_NETWORK:-hotel-bugambilia_default}


