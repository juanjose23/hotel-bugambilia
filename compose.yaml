name: hotel-bugambilia

x-review: &review
  image: hotel-bugambilia:review
  init: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment:
    AUTO_MIGRATE: "false"
    AUTO_SEED: "false"
  volumes:
    - hotel-storage:/var/www/html/storage

services:
  app:
    <<: *review
    build:
      context: .
      target: review
    ports:
      - "127.0.0.1:${HOTEL_PORT:-80}:80"

  worker:
    <<: *review
    pull_policy: never
    user: www-data
    stop_signal: SIGTERM
    stop_grace_period: 660s
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600"]
    restart: unless-stopped

  scheduler:
    <<: *review
    pull_policy: never
    user: www-data
    stop_signal: SIGTERM
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

volumes:
  hotel-storage:

networks:
  default:
    name: ${DOCKER_NETWORK:-hotel-bugambilia_default}
